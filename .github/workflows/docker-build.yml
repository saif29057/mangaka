name: CI - build des images Docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build des images
        run: docker compose build backend frontend
      - name: Démarrage et test de /health
        run: |
          docker compose up -d backend
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker compose logs backend
          exit 1
